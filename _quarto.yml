project:
  type: website
  render:
    - "*.qmd"
    - "posts"

lang: zh

website:
  description: "Dingtian 的技术笔记：CS 与 AI 学习记录"
  site-url: https://dingtian-feng.github.io
  title: "Dingtian's Notes"
  favicon: favicon.svg
  image: profile.jpg
  open-graph: true
  twitter-card: true

format:
  html:
    theme: none
    css: styles.css
    toc: false
    date-format: iso
    highlight-style: dracula
    include-before-body: _header.html
    include-after-body: _footer.html
    include-in-header:
      text: |
        <meta name="theme-color" content="#0b0e11">
